minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
# comark-ui's plugins (onmax's packages): their 0.10.1 releases were published without provenance.
trustPolicyExclude:
  - comark-annotate
  - comark-badge
  - comark-cards
  - comark-carousel
  - comark-cast
  - comark-charts
  - comark-chips
  - comark-cjk
  - comark-code
  - comark-code-notes
  - comark-colors
  - comark-comments
  - comark-critic
  - comark-deflist
  - comark-details
  - comark-diagrams
  - comark-diff
  - comark-embed
  - comark-fields
  - comark-figure
  - comark-file-tree
  - comark-footnotes
  - comark-github
  - comark-icon
  - comark-include
  - comark-keys
  - comark-links
  - comark-magic-move
  - comark-mark
  - comark-mathml
  - comark-media
  - comark-metrics
  - comark-outline
  - comark-properties
  - comark-qr
  - comark-quiz
  - comark-reading-time
  - comark-sources
  - comark-steps
  - comark-table
  - comark-tabs
  - comark-tests
  - comark-time
  - comark-xref
  - comark-zoom

shellEmulator: true

packages:
  - .
  - packages/*
  - docs

# The docs site pins every ViteHub package to one release, so peers resolve to one copy of each.
overrides:
  # vitehub:start
  '@vite-hub/agent': ^0.3.1
  '@vite-hub/auth': ^0.3.1
  '@vite-hub/blob': ^0.3.1
  '@vite-hub/browser': ^0.3.1
  '@vite-hub/bundle': ^0.3.1
  '@vite-hub/channels': ^0.3.1
  '@vite-hub/cli': ^0.3.1
  '@vite-hub/cms': ^0.3.1
  '@vite-hub/codemods': ^0.3.1
  '@vite-hub/comments': ^0.3.1
  '@vite-hub/connections': ^0.3.1
  '@vite-hub/content': ^0.3.1
  '@vite-hub/database': ^0.3.1
  '@vite-hub/decisions': ^0.3.1
  '@vite-hub/docs': ^0.3.1
  '@vite-hub/email': ^0.3.1
  '@vite-hub/env': ^0.3.1
  '@vite-hub/forge': ^0.3.1
  '@vite-hub/forms': ^0.3.1
  '@vite-hub/gateways': ^0.3.1
  '@vite-hub/i18n': ^0.3.1
  '@vite-hub/kit': ^0.3.1
  '@vite-hub/kv': ^0.3.1
  '@vite-hub/markdown-template': ^0.3.1
  '@vite-hub/mcp': ^0.3.1
  '@vite-hub/presets': ^0.3.1
  '@vite-hub/queue': ^0.3.1
  '@vite-hub/rate-limit': ^0.3.1
  '@vite-hub/realtime': ^0.3.1
  '@vite-hub/runtime': ^0.3.1
  '@vite-hub/sandbox': ^0.3.1
  '@vite-hub/schedule': ^0.3.1
  '@vite-hub/shell': ^0.3.1
  '@vite-hub/source': ^0.3.1
  '@vite-hub/sync': ^0.3.1
  '@vite-hub/ui': ^0.3.1
  '@vite-hub/web-container': ^0.3.1
  '@vite-hub/webhooks': ^0.3.1
  '@vite-hub/workflow': ^0.3.1
  '@vite-hub/workspace': ^0.3.1
  # vitehub:end
  vite-hub: ^0.3.1

allowBuilds:
  '@mongodb-js/zstd': false
  esbuild: true
  node-liblzma: false
  vue-demi: true
