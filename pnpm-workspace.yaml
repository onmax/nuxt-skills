# The docs site uses ViteHub builds from pkg.pr.new, whose tarballs depend on other pkg.pr.new tarballs.
blockExoticSubdeps: false
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
# comark-ui's plugins (onmax's packages): their 0.10.1 releases were published without provenance.
trustPolicyExclude:
  - comark-annotate
  - comark-badge
  - comark-cards
  - comark-carousel
  - comark-cast
  - comark-charts
  - comark-chips
  - comark-cjk
  - comark-code
  - comark-code-notes
  - comark-colors
  - comark-comments
  - comark-critic
  - comark-deflist
  - comark-details
  - comark-diagrams
  - comark-diff
  - comark-embed
  - comark-fields
  - comark-figure
  - comark-file-tree
  - comark-footnotes
  - comark-github
  - comark-icon
  - comark-include
  - comark-keys
  - comark-links
  - comark-magic-move
  - comark-mark
  - comark-mathml
  - comark-media
  - comark-metrics
  - comark-outline
  - comark-properties
  - comark-qr
  - comark-quiz
  - comark-reading-time
  - comark-sources
  - comark-steps
  - comark-table
  - comark-tabs
  - comark-tests
  - comark-time
  - comark-xref
  - comark-zoom

shellEmulator: true

packages:
  - .
  - packages/*
  - docs

# The docs site pins every ViteHub package to one pkg.pr.new build, so peers resolve to one copy of each.
overrides:
  # vitehub:start
  '@vite-hub/agent': https://pkg.pr.new/vite-hub/vitehub/@vite-hub/agent@ccf65749c55a9b3f498f4868c81ee3a58c71f9dc
