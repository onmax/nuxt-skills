  # vitehub:end
  # The range >=1.0.0-rc.5 picks 1.0.0-rc.5-ab785fc, a tagged build without drizzle-orm/d1/codecs, which ViteHub's D1 driver imports.
  drizzle-orm: 1.0.0-rc.5
  vite-hub: https://pkg.pr.new/vite-hub/vitehub/vite-hub@5591bb93b0c4bdb7ac51ef499e96435ec7484e22

allowBuilds:
  '@mongodb-js/zstd': false
  esbuild: true
  node-liblzma: false
  vue-demi: true
