# The docs site uses ViteHub builds from pkg.pr.new, whose tarballs depend on other pkg.pr.new tarballs.
blockExoticSubdeps: false
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
# comark-ui's plugins (onmax's packages): their 0.10.1 releases were published without provenance.
trustPolicyExclude:
  - comark-annotate
  - comark-badge
  - comark-cards
  - comark-carousel
  - comark-cast
  - comark-charts
  - comark-chips
  - comark-cjk
  - comark-code
  - comark-code-notes
  - comark-colors
  - comark-comments
  - comark-critic
  - comark-deflist
  - comark-details
  - comark-diagrams
  - comark-diff
  - comark-embed
  - comark-fields
  - comark-figure
  - comark-file-tree
  - comark-footnotes
  - comark-github
  - comark-icon
  - comark-include
  - comark-keys
  - comark-links
  - comark-magic-move
  - comark-mark
  - comark-mathml
  - comark-media
  - comark-metrics
  - comark-outline
  - comark-properties
  - comark-qr
  - comark-quiz
  - comark-reading-time
  - comark-sources
  - comark-steps
  - comark-table
  - comark-tabs
  - comark-tests
  - comark-time
  - comark-xref
  - comark-zoom
# ViteHub's generated server code imports @vite-hub/* packages from the app root.
publicHoistPattern:
  - '@vite-hub/*'
  # Nuxt aliases optional server packages, such as ws's utf-8-validate, to mocked-exports, resolved from the package's folder.
  - mocked-exports

shellEmulator: true

packages:
  - .
  - packages/*
  - docs

# The docs site pins every ViteHub package to one pkg.pr.new build, so peers resolve to one copy of each.
overrides:
  # @nuxt/ui asks for ^0.14, which downloads fonts in Nitro's rollup:before hook. Nuxt 5 never calls it, so every font
  # file shipped empty. 1.x downloads them when Vite finishes the bundle.
  '@nuxt/fonts': 1.2.0
  # vitehub:start
  '@vite-hub/agent': https://pkg.pr.new/vite-hub/vitehub/@vite-hub/agent@5591bb93b0c4bdb7ac51ef499e96435ec7484e22
