# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    env:
      OPENAI_COMPATIBLE_BASE_URL: https://ai.onmax.me/v1
      OPENAI_COMPATIBLE_MODEL: gpt-6.1-sol
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Verify CLIProxy completion
        env:
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLIPROXY_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLIPROXY_CF_ACCESS_CLIENT_SECRET }}
        run: |
          response=$(curl --fail --silent --show-error --max-time 45 \
            --header "Authorization: Bearer $OPENAI_COMPATIBLE_API_KEY" \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg model "$OPENAI_COMPATIBLE_MODEL" \
              '{model: $model, messages: [{role: "user", content: "Reply with exactly PROXY_OK."}], max_tokens: 32, stream: false}')" \
            "$OPENAI_COMPATIBLE_BASE_URL/chat/completions")
          jq -e '.choices[0].message.content | contains("PROXY_OK")' <<< "$response" > /dev/null
      - name: Run agent
        uses: pullfrog/pullfrog@3c58d31073422cc1b9573f58b5dbadb7a4914715 # v0.1.123
        with:
          prompt: ${{ inputs.prompt }}
          model: openai-compatible/byok
        env:
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
          OPENAI_COMPATIBLE_CONTEXT: '921000'
          OPENAI_COMPATIBLE_MAX_OUTPUT: '128000'
          OPENAI_COMPATIBLE_HEADERS: |
            CF-Access-Client-Id: ${{ secrets.CLIPROXY_CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CLIPROXY_CF_ACCESS_CLIENT_SECRET }}
