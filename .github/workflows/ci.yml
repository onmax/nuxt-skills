name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - run: node --test scripts/nuxt-module-registry.test.mjs
      - run: pnpm install
      - run: pnpm lint --fix
      - run: pnpm typecheck
      - run: pnpm check:links

      - name: Commit lint fixes
        uses: stefanzweifel/git-auto-commit-action@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          commit_message: 'chore: auto-fix lint errors'
          file_pattern: '*.md skills/**/*.md'

  validate-skills:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install skills-ref
        run: pip install git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref

      - name: Validate all skills
        run: |
          for skill in skills/*/; do
            echo "Validating $skill..."
            skills-ref validate "$skill"
          done
