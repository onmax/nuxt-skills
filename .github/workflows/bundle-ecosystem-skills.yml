name: Bundle Ecosystem Skills

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Bundle upstream skills
        run: node scripts/bundle-ecosystem-skills.mjs --bump-plugin

      - name: Validate bundled skills
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install skills-ref
        run: pip install git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref

      - name: Validate all skills
        run: |
          for skill in skills/*/; do
            skills-ref validate "$skill"
          done

      - name: Check skill links
        run: node scripts/check-skill-links.mjs

      - name: Validate plugin manifests
        run: |
          python3 -m json.tool .codex-plugin/plugin.json >/dev/null
          python3 -m json.tool .claude-plugin/plugin.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null

      - name: Commit and push when the bundle changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No ecosystem skill changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin .codex-plugin README.md ecosystem-skills.lock.json skills
          git commit -m "chore: bundle ecosystem skills"
          git push
