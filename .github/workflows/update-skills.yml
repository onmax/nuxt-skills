name: Update Skills

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 6am UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install

      - name: Clone reka-ui
        run: git clone --depth 1 https://github.com/unovue/reka-ui.git /tmp/reka-ui

      - name: Check reka-ui version
        id: reka-version
        run: |
          CURRENT=$(jq -r '.["reka-ui"]' skills/versions.json)
          NEW=$(jq -r '.version' /tmp/reka-ui/packages/core/package.json | cut -d. -f1)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT
          if [ "$NEW" != "$CURRENT" ]; then
            echo "::warning::reka-ui major version changed: $CURRENT → $NEW (skipping)"
          fi

      - name: Update reka-ui
        if: steps.reka-version.outputs.current == steps.reka-version.outputs.new
        run: pnpm generate:reka-ui

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-update skill docs"
          git push
